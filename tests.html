<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>calc.js 테스트</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: #16a34a; } .fail { color: #dc2626; font-weight: bold; }
    h1 { font-size: 18px; }
  </style>
</head>
<body>
  <h1>calc.js 단위 테스트 — 콘솔과 아래에 결과 출력</h1>
  <div id="out"></div>

  <script type="module">
    import { adjust, suggestFromHistory, extractFromText, FACTORS } from './calc.js';
    import { mergeCore } from './store.js';

    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    function ok(name, cond) {
      const line = document.createElement('div');
      line.className = cond ? 'pass' : 'fail';
      line.textContent = (cond ? '✓ PASS  ' : '✗ FAIL  ') + name;
      out.appendChild(line);
      console.assert(cond, name);
      cond ? pass++ : fail++;
    }
    function near(a, b, tol = 0.6) { return Math.abs(a - b) <= tol; }

    // 1) 와트비 1.0 + 같은 양 + 실온 → 변화 없음
    {
      const r = adjust(
        { baseTemp: 200, baseTime: 10, baseAmount: 300, baseWattage: 1500, source: 'package', startState: 'room' },
        { wattage: 1500 }, 300);
      const mid = (r.timeMin + r.timeMax) / 2;
      ok('와트비 1.0·동일 양: 온도 유지(200)', r.temp === 200);
      ok('와트비 1.0·동일 양: 시간 ~10분 유지', near(mid, 10));
    }

    // 2) 양 2배 → 시간 × 2^0.4 (≈1.32배 → 약 13분)
    {
      const r = adjust(
        { baseTemp: 200, baseTime: 10, baseAmount: 300, baseWattage: 1500, source: 'package', startState: 'room' },
        { wattage: 1500 }, 600);
      const mid = (r.timeMin + r.timeMax) / 2;
      const expected = 10 * Math.pow(2, FACTORS.amountExp);
      ok(`양 2배: 시간 ~${expected.toFixed(1)}분 (2배 아님)`, near(mid, expected, 0.8));
    }

    // 3) 오븐 출처 변환: 온도 -20, 시간 ×0.8
    {
      const r = adjust(
        { baseTemp: 200, baseTime: 20, baseAmount: 300, baseWattage: 1500, source: 'oven', startState: 'room' },
        { wattage: 1500 }, 300);
      const mid = (r.timeMin + r.timeMax) / 2;
      ok('오븐 변환: 온도 180℃', r.temp === 180);
      ok('오븐 변환: 시간 ~16분(20×0.8)', near(mid, 16, 0.8));
    }

    // 4) 저출력 기기 → 시간 증가 (1500W 기준 → 1000W)
    {
      const hi = adjust({ baseTemp: 200, baseTime: 10, baseAmount: 300, baseWattage: 1500, source: 'package', startState: 'room' }, { wattage: 1500 }, 300);
      const lo = adjust({ baseTemp: 200, baseTime: 10, baseAmount: 300, baseWattage: 1500, source: 'package', startState: 'room' }, { wattage: 1000 }, 300);
      ok('저출력(1000W) 기기는 시간이 더 길다', (lo.timeMin + lo.timeMax) > (hi.timeMin + hi.timeMax));
    }

    // 5) 냉동 → 안전마진 + unreliable 플래그
    {
      const r = adjust({ baseTemp: 200, baseTime: 10, baseAmount: 300, baseWattage: 1500, source: 'package', startState: 'frozen' }, { wattage: 1500 }, 300);
      ok('냉동: unreliable=true', r.unreliable === true);
      ok('냉동: 시간 증가(>10)', (r.timeMin + r.timeMax) / 2 > 10);
    }

    // 6) suggestFromHistory: 마지막 good 기록 반환
    {
      const recipe = { successLog: [
        { result: 'burnt', deviceId: 'A', actualTemp: 200, actualTime: 12 },
        { result: 'good', deviceId: 'A', actualTemp: 190, actualTime: 11 },
        { result: 'good', deviceId: 'B', actualTemp: 180, actualTime: 9 },
      ]};
      const s = suggestFromHistory(recipe, 'A');
      ok('history: 기기 A의 마지막 good(190/11)', s && s.temp === 190 && s.time === 11);
      ok('history: 기록 없는 기기 → null', suggestFromHistory(recipe, 'Z') === null);
    }

    // 7) 텍스트 추출
    {
      ok('추출: "200도 12분"', JSON.stringify(extractFromText('에어프라이어 200도 12분')) === JSON.stringify({ temp: 200, time: 12 }));
      ok('추출: "180℃ 8~10분" → 9분', extractFromText('180℃ 8~10분').time === 9);
      ok('추출: "200°C 15 min"', extractFromText('Cook at 200°C for 15 min').temp === 200);
      ok('추출: 없음 → null', extractFromText('소금 약간').temp === null);
    }

    // 8) 동기화 머지 — tombstone + per-item updatedAt + successLog union
    {
      const st = (recipes, devices = []) => ({ recipes, myDevices: devices, settings: { lastUsed: {} } });
      const rec = (o) => Object.assign({ id: 'r1', updatedAt: 0, deletedAt: null, successLog: [] }, o);

      // 8a) 삭제가 더 최신 → tombstone 유지(부활 방지)
      {
        const local = st([rec({ name: 'A', updatedAt: 100 })]);
        const remote = st([rec({ name: 'A', deletedAt: 200, updatedAt: 200 })]);
        const m = mergeCore(local, remote);
        ok('머지: 원격 삭제(최신)가 로컬 살아있는 항목을 이김', m.recipes[0].deletedAt === 200);
      }

      // 8b) 로컬 삭제가 최신 → 원격 부활 막음
      {
        const local = st([rec({ name: 'A', deletedAt: 200, updatedAt: 200 })]);
        const remote = st([rec({ name: 'A', updatedAt: 100 })]);
        const m = mergeCore(local, remote);
        ok('머지: 로컬 삭제(최신) 유지 — 원격이 부활 못 시킴', !!m.recipes[0].deletedAt);
      }

      // 8c) per-item LWW: 원격이 최신이면 원격 값 채택
      {
        const local = st([rec({ name: '옛이름', updatedAt: 100 })]);
        const remote = st([rec({ name: '새이름', updatedAt: 200 })]);
        const m = mergeCore(local, remote);
        ok('머지: updatedAt 큰 쪽(원격) 값 채택', m.recipes[0].name === '새이름');
      }

      // 8d) 동시 추가 — 양쪽 항목 모두 보존 + 수렴 푸시 필요
      {
        const local = st([rec({ id: 'a', updatedAt: 100 })]);
        const remote = st([rec({ id: 'b', updatedAt: 100 })]);
        const m = mergeCore(local, remote);
        ok('머지: 동시 추가 시 두 항목 모두 보존', m.recipes.length === 2);
        ok('머지: 로컬만의 항목 있으면 pushNeeded=true', m.pushNeeded === true);
      }

      // 8e) successLog는 승자와 무관하게 union(기록 유실 방지)
      {
        const local = st([rec({ updatedAt: 200, successLog: [{ id: 'L1', result: 'good' }] })]);
        const remote = st([rec({ updatedAt: 100, successLog: [{ id: 'L2', result: 'burnt' }] })]);
        const m = mergeCore(local, remote);
        const ids = m.recipes[0].successLog.map(e => e.id).sort();
        ok('머지: successLog 양쪽 union(L1+L2)', JSON.stringify(ids) === JSON.stringify(['L1', 'L2']));
      }

      // 8f) 동일 상태 머지는 무변화(루프 방지)
      {
        const a = st([rec({ name: 'A', updatedAt: 100 })]);
        const b = st([rec({ name: 'A', updatedAt: 100 })]);
        const m = mergeCore(a, b);
        ok('머지: 동일 상태면 changed=false', m.changed === false);
        ok('머지: 동일 상태면 pushNeeded=false', m.pushNeeded === false);
      }
    }

    const summary = document.createElement('h1');
    summary.textContent = `결과: ${pass} 통과 / ${fail} 실패`;
    summary.style.color = fail ? '#dc2626' : '#16a34a';
    out.prepend(summary);
  </script>
</body>
</html>
