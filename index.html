<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fbf7f2">
  <title>에어프라이기 레시피 보관함</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <header id="topbar"><span class="logo-mark">🍟</span> 레시피 보관함</header>
  <div id="nudge"></div>
  <main id="view"></main>

  <nav id="tabs">
    <button data-action="tab-home" data-tab="home"><span>🏠</span>레시피</button>
    <button data-action="tab-add" data-tab="add"><span>➕</span>추가</button>
    <button data-action="tab-settings" data-tab="settings"><span>⚙️</span>설정</button>
  </nav>

  <script type="module" src="app.js"></script>
  <script>
    // 서비스워커 등록 (https/localhost에서만 동작; file://에선 자동 skip)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
